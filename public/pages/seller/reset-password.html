<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#063d34">
  <title>Đặt lại mật khẩu | DuLichConDen 2.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f8f6;
      color: #18352d;
      font-family: Arial, Helvetica, sans-serif;
    }
    .reset-card {
      width: min(100%, 460px);
      padding: 28px;
      border: 1px solid #dce8e1;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(20,65,48,.07);
    }
    h1 { margin: 0 0 10px; color: #063d34; font-size: 25px; }
    p { color: #63756e; font-size: 14px; line-height: 1.6; }
    label { display: grid; gap: 7px; margin: 16px 0; font-size: 13px; font-weight: 700; }
    input {
      width: 100%; min-height: 46px; padding: 11px 12px;
      border: 1px solid #cbdad1; border-radius: 8px;
      color: #18352d; font-size: 15px;
    }
    button {
      width: 100%; min-height: 46px; margin-top: 8px; padding: 12px;
      border: 0; border-radius: 8px; background: #075744;
      color: white; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .notice {
      padding: 13px; margin: 16px 0; border-radius: 9px;
      background: #edf4ef; color: #315d48; font-size: 13px; line-height: 1.6;
    }
    .notice.error { background: #fff0ef; color: #963d36; }
    .notice.success { background: #eaf6ee; color: #155b35; }
    a { color: #075744; font-size: 13px; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Tạo mật khẩu mới cho tài khoản người bán DuLichConDen 2.0.</p>

    <div id="reset-status" class="notice" role="status" aria-live="polite">
      Đang xác minh liên kết khôi phục...
    </div>

    <form id="reset-form" hidden>
      <label>
        Mật khẩu mới (ít nhất 8 ký tự)
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>
        Nhập lại mật khẩu mới
        <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button id="reset-submit" type="submit">Lưu mật khẩu mới</button>
    </form>

    <p><a href="./index.html">Quay lại trang đăng nhập người bán</a></p>
  </main>

  <script type="module">
    import { supabase, supabaseConfigured } from "../../js/marketplace/supabase-client.js";

    const statusEl = document.getElementById("reset-status");
    const form = document.getElementById("reset-form");
    const submit = document.getElementById("reset-submit");
    let recoverySessionReady = false;

    function showStatus(message, type = "info") {
      statusEl.textContent = message;
      statusEl.className = `notice ${type}`;
      statusEl.hidden = false;
    }

    function enablePasswordForm() {
      recoverySessionReady = true;
      form.hidden = false;
      showStatus("Liên kết hợp lệ. Hãy nhập mật khẩu mới của bạn.", "success");
    }

    if (!supabaseConfigured || !supabase) {
      showStatus("Website chưa được cấu hình Supabase.", "error");
    } else {
      // Đăng ký listener trước để không bỏ lỡ sự kiện PASSWORD_RECOVERY.
      const { data: authListener } = supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          enablePasswordForm();
        }
      });

      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const hasRecoveryMarker = params.has("code") || hashParams.get("type") === "recovery";

      if (hasRecoveryMarker) {
        const { data, error } = await supabase.auth.getSession();
        if (error) {
          showStatus(error.message || "Không xác minh được liên kết.", "error");
        } else if (data.session) {
          enablePasswordForm();
        } else {
          showStatus("Liên kết đã hết hạn hoặc không hợp lệ. Hãy quay lại trang đăng nhập và yêu cầu gửi liên kết mới.", "error");
        }
      } else {
        showStatus("Trang này chỉ mở được bằng liên kết khôi phục mật khẩu gửi đến email của bạn. Hãy yêu cầu gửi liên kết mới nếu cần.", "error");
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (!recoverySessionReady) {
          showStatus("Phiên khôi phục chưa hợp lệ. Hãy yêu cầu gửi liên kết mới.", "error");
          return;
        }

        const password = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;

        if (password.length < 8) {
          showStatus("Mật khẩu phải có ít nhất 8 ký tự.", "error");
          return;
        }
        if (password !== confirm) {
          showStatus("Hai lần nhập mật khẩu không khớp.", "error");
          return;
        }

        submit.disabled = true;
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) throw error;

          showStatus("Đổi mật khẩu thành công. Bạn sẽ được chuyển về trang đăng nhập.", "success");
          form.hidden = true;
          await supabase.auth.signOut();
          window.setTimeout(() => {
            window.location.href = "./index.html?password-updated=1";
          }, 1200);
        } catch (error) {
          console.error("Password update failed:", error);
          showStatus(error.message || "Không thể cập nhật mật khẩu. Hãy thử lại.", "error");
        } finally {
          submit.disabled = false;
        }
      });

      window.addEventListener("pagehide", () => authListener.subscription.unsubscribe(), { once: true });
    }
  </script>
</body>
</html>
